onboarding = false

[ui]
sidebar_start_collapsed = true
pane_gaps = false
host_cursor = "native"

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
default_shell = "pwsh.exe"

[keys]
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[update]
channel = "preview"

[experimental]
kitty_graphics = true
